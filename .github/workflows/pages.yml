name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y libxml2-utils && python3 tools/gen_grid.py && tools/validate.sh
      - uses: actions/upload-pages-artifact@v3
        with: { path: viewer }
      - id: d
        uses: actions/deploy-pages@v4
